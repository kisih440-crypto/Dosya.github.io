<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Dosyalarım</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000000; --sub:#8a8a8e; --sep:rgba(60,60,67,.18);
  --blue:#007aff; --red:#ff3b30; --green:#34c759; --fill:rgba(120,120,128,.12);
  --glass:rgba(249,249,249,.78);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000000; --card:#1c1c1e; --text:#ffffff; --sub:#8e8e93; --sep:rgba(84,84,88,.55);
  --blue:#0a84ff; --red:#ff453a; --green:#30d158; --fill:rgba(120,120,128,.24); --glass:rgba(30,30,30,.75);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.screen{display:none;width:100%;max-width:600px;margin:0 auto;padding:16px 16px 40px}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Login */
.login{padding-top:8vh;text-align:center}
.app-icon{width:92px;height:92px;border-radius:22px;margin:0 auto 22px;
  background:linear-gradient(145deg,#5ac8fa,#007aff);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,122,255,.35)}
.app-icon svg{width:50px;height:50px;fill:#fff}
h1.large{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 6px}
.lead{color:var(--sub);font-size:15px;margin:0 0 28px}
.group{background:var(--card);border-radius:12px;overflow:hidden;text-align:left}
.group .row{display:flex;align-items:center;padding:0 16px;min-height:48px;border-bottom:.5px solid var(--sep)}
.group .row:last-child{border-bottom:none}
.group input{width:100%;border:none;outline:none;background:transparent;color:var(--text);
  font-size:17px;padding:13px 0;font-family:inherit}
.group input::placeholder{color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:14px;background:var(--blue);color:#fff;
  font-size:17px;font-weight:600;padding:15px;margin-top:18px;cursor:pointer;font-family:inherit;transition:.15s;text-align:center}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.plain{background:var(--fill);color:var(--blue)}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:none;color:var(--blue);font-size:15px;margin-top:18px;cursor:pointer;font-family:inherit}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:12px;word-break:break-word}

/* Nav */
.nav{position:sticky;top:0;z-index:10;margin:-16px -16px 10px;padding:14px 16px 12px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--sep)}
.nav-top{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.nav-top button{background:none;border:none;color:var(--blue);font-size:17px;font-weight:500;cursor:pointer;font-family:inherit;padding:0}
.nav h1{font-size:32px;font-weight:700;margin:6px 0 0;line-height:1.2}
.email{color:var(--sub);font-size:13px;margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section{font-size:13px;text-transform:uppercase;color:var(--sub);margin:24px 8px 8px;letter-spacing:.3px;font-weight:600}

/* Arama Çubuğu */
.search-box{margin:16px 0 8px}
.search-box input{
  width:100%;border:none;outline:none;background:var(--card);color:var(--text);
  font-size:16px;padding:12px 16px 12px 42px;border-radius:12px;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.04);border:.5px solid var(--sep);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%238a8a8e" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
  background-repeat:no-repeat;background-position:14px center;
}
.search-box input::placeholder{color:var(--sub)}

/* Upload */
.drop{background:var(--card);border-radius:14px;padding:24px 16px;text-align:center;
  border:1.5px dashed var(--sep);cursor:pointer;transition:.2s;display:block}
.drop.over{border-color:var(--blue);background:var(--fill)}
.drop .plus{width:50px;height:50px;border-radius:50%;background:var(--fill);margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center}
.drop .plus svg{width:24px;height:24px;fill:var(--blue)}
.drop b{font-size:16px;display:block;color:var(--text)}
.drop span{color:var(--sub);font-size:14px}
input[type=file]{display:none}

.picked{display:none;margin-top:12px}
.picked.show{display:block}

/* Çoklu Dosya Kartları & Silme Butonu */
.picked-item{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.picked-item:last-child{border-bottom:none}
.picked-row{display:flex;align-items:center;gap:10px}
.rename-input{flex:1;border:none;outline:none;background:var(--fill);padding:8px 12px;border-radius:8px;font-size:15px;color:var(--text);font-family:inherit}
.ext-badge{font-size:13px;color:var(--sub);font-weight:600;flex:none}
.remove-btn{background:none;border:none;color:var(--red);font-size:18px;font-weight:bold;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;display:flex;align-items:center;justify-content:center}
.remove-btn:hover{background:var(--fill)}

.progress{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;display:none;width:100%}
.progress.show{display:block}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s ease}

/* File rows */
.file{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;
  border-bottom:.5px solid var(--sep);transition:background .15s}
.file:last-child{border-bottom:none}
.file:active{background:var(--fill)}
.file.pinned-row{background:rgba(0,122,255,.04)}
.ficon{width:42px;height:42px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.finfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.fname{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);display:flex;align-items:center;gap:6px}
.fmeta{font-size:13px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:8px;height:14px;fill:none;stroke:var(--sub);stroke-width:2;opacity:.6;flex:none;margin-left:4px}
.empty{padding:34px 16px;text-align:center;color:var(--sub);font-size:15px}
.spinner{width:24px;height:24px;border:2.5px solid var(--fill);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:50}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:600px;margin:0 auto;
  background:var(--bg);border-radius:20px 20px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 16px}
.sheet .big{width:68px;height:68px;border-radius:16px;margin:0 auto 12px;font-size:14px}
.sheet h2{font-size:19px;font-weight:600;text-align:center;margin:0 0 16px;word-break:break-word;padding:0 8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-size:15px;border-bottom:.5px solid var(--sep)}
.kv:last-child{border:none}
.kv span:first-child{color:var(--sub);flex:none}
.kv span:last-child{text-align:right;word-break:break-word;color:var(--text);font-weight:500}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  padding:12px 20px;border-radius:22px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.18);
  transition:transform .4s cubic-bezier(.32,.72,0,1);z-index:100;max-width:90%;text-align:center;border:.5px solid var(--sep)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div class="screen login active" id="loginScreen">
  <div class="app-icon">
    <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
  </div>
  <h1 class="large" id="loginTitle">Giriş Yap</h1>
  <p class="lead">Dosyalarına erişmek için hesabınla giriş yap.</p>
  <div class="group">
    <div class="row"><input type="email" id="email" placeholder="E-posta" autocomplete="email" autocapitalize="off"></div>
    <div class="row"><input type="password" id="password" placeholder="Şifre" autocomplete="current-password"></div>
  </div>
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn">Giriş Yap</button>
</div>

<!-- ANA EKRAN -->
<div class="screen" id="homeScreen">
  <div class="nav">
    <div class="nav-top">
      <span id="roleBadge" style="font-size:13px; font-weight:600; color:var(--green); display:none;">Admin Modu</span>
      <button id="logoutBtn">Çıkış</button>
    </div>
    <h1 id="screenTitle">Dosyalarım</h1>
    <p class="email" id="userEmail"></p>
  </div>

  <!-- Normal kullanıcılar için yükleme alanı (Adminse gizlenebilir veya yükleme yapabilir) -->
  <div id="uploadSection">
    <div class="section">Dosya Yükle (En Fazla 4)</div>
    <label class="drop" id="drop" for="fileInput">
      <div class="plus"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></div>
      <b>Dosyaları seç</b>
      <span>veya buraya sürükle (En fazla 4 adet)</span>
    </label>
    <input type="file" id="fileInput" multiple>

    <div class="picked" id="picked">
      <div class="group" id="pickedList"></div>
      <button class="btn" id="uploadBtn">Yükle</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Dosyalarda ara...">
  </div>

  <div class="section" id="listSectionTitle">Yüklenen Dosyalar</div>
  <div class="group" id="list"><div class="spinner"></div></div>
</div>

<!-- DETAY SHEET -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="ficon big" id="sIcon"></div>
  <h2 id="sName"></h2>
  <div class="group">
    <div class="kv"><span>Format</span><span id="sFormat"></span></div>
    <div class="kv"><span>Boyut</span><span id="sSize"></span></div>
    <div class="kv" id="ownerRow" style="display:none"><span>Kullanıcı ID</span><span id="sOwner" style="font-size:12px"></span></div>
    <div class="kv"><span>Yüklenme</span><span id="sDate"></span></div>
  </div>
  <button class="btn" id="downloadBtn">İndir</button>
  <button class="btn plain" id="pinBtn" style="margin-top:10px">Başa Sabitle</button>
  <button class="btn danger" id="deleteBtn" style="margin-top:10px; display:none;">Dosyayı Sil</button>
  <button class="btn plain" id="closeBtn" style="margin-top:10px">Kapat</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";
import { getDatabase, ref as dbRef, push, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoNpYJUYWJYSoeL7YzvXooulawpFOhufs",
  authDomain: "arif-af888.firebaseapp.com",
  databaseURL: "https://arif-af888-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "arif-af888",
  storageBucket: "arif-af888.firebasestorage.app",
  messagingSenderId: "270158527238",
  appId: "1:270158527238:web:2f2402de5b36f9d207bc87"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getDatabase(app);

const ADMIN_UID = "J0VHrKf0jBMssN4GyxmRLa8Kou63";

const $ = id => document.getElementById(id);
let currentUser = null, pickedFiles = [], selected = null, unsubFiles = null;
let allFilesData = [];

/* ---------- Yardımcı Fonksiyonlar ---------- */
const colors = {
  PDF:"#ff3b30", DOC:"#007aff", DOCX:"#007aff", XLS:"#34c759", XLSX:"#34c759", CSV:"#34c759",
  PPT:"#ff9500", PPTX:"#ff9500", ZIP:"#8e8e93", RAR:"#8e8e93", "7Z":"#8e8e93",
  MP3:"#ff2d55", WAV:"#ff2d55", MP4:"#af52de", MOV:"#af52de", MKV:"#af52de",
  JPG:"#5ac8fa", JPEG:"#5ac8fa", PNG:"#5ac8fa", GIF:"#5ac8fa", HEIC:"#5ac8fa", WEBP:"#5ac8fa",
  TXT:"#636366", JSON:"#636366", HTML:"#ff9500", JS:"#ffcc00", EXE:"#1c1c1e", APK:"#30b0c7"
};

const ext = name => {
  if(!name) return "DOSYA";
  const i = name.lastIndexOf(".");
  return i > 0 ? name.slice(i + 1).toUpperCase() : "DOSYA";
};

const baseNameWithoutExt = name => {
  if(!name) return "";
  const i = name.lastIndexOf(".");
  return i > 0 ? name.slice(0, i) : name;
};

const color = e => colors[e] || "#5856d6";

const size = b => {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
};

const dateStr = d => new Date(d).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" });
const esc = s => (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const badge = e => e.length > 4 ? e.slice(0, 4) : e;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active"); window.scrollTo(0, 0);
}

const authErr = code => ({
  "auth/invalid-email":"Geçersiz e-posta adresi.",
  "auth/invalid-credential":"E-posta veya şifre hatalı.",
  "auth/user-not-found":"Bu e-posta ile hesap bulunamadı.",
  "auth/wrong-password":"Şifre hatalı.",
  "auth/too-many-requests":"Çok fazla deneme. Biraz bekle.",
  "auth/operation-not-allowed":"E-posta/Şifre girişi Firebase'de açık değil.",
  "auth/network-request-failed":"İnternet bağlantısı yok."
}[code] || "Bir hata oluştu: " + code);

/* ---------- Giriş/Çıkış ---------- */
async function doLogin() {
  const email = $("email").value.trim(), pw = $("password").value;
  if (!email || !pw) { $("loginErr").textContent = "E-posta ve şifre gir."; return; }
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) { 
    $("loginErr").textContent = authErr(e.code); 
  } finally {
    $("loginBtn").disabled = false;
  }
}

$("loginBtn").onclick = doLogin;
$("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    $("userEmail").textContent = user.email;
    
    if (user.uid === ADMIN_UID) {
      $("roleBadge").style.display = "inline-block";
      $("screenTitle").textContent = "Tüm Dosyalar (Admin)";
      listenAllFilesForAdmin();
    } else {
      $("roleBadge").style.display = "none";
      $("screenTitle").textContent = "Dosyalarım";
      listenFiles();
    }

    show("homeScreen"); 
  } else {
    if (unsubFiles) { unsubFiles(); unsubFiles = null; }
    pickedFiles = []; 
    $("picked").classList.remove("show");
    $("password").value = ""; 
    show("loginScreen");
  }
});

/* ---------- Liste Render ve Arama ---------- */
function renderList(items, searchTerm) {
  const list = $("list");
  const query = (searchTerm || "").toLocaleLowerCase('tr-TR');
  
  const filtered = items.filter(it => {
    if (!query) return true;
    const matchName = it.name.toLocaleLowerCase('tr-TR').includes(query);
    const matchExt = ext(it.name).toLocaleLowerCase('tr-TR').includes(query);
    const matchOwner = it.ownerUid && it.ownerUid.toLocaleLowerCase('tr-TR').includes(query);
    return matchName || matchExt || matchOwner;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${query ? "Aranan kriterlere uygun dosya bulunamadı." : "Henüz dosya yüklenmedi."}</div>`;
    return;
  }

  list.innerHTML = "";
  filtered.forEach(it => {
    const e = ext(it.name);
    const isAdmin = currentUser && currentUser.uid === ADMIN_UID;
    const row = document.createElement("div");
    row.className = `file ${it.pinned ? 'pinned-row' : ''}`;
    row.innerHTML = `
      <div class="ficon" style="background:${color(e)}">${esc(badge(e))}</div>
      <div class="finfo">
        <div class="fname">
          ${it.pinned ? '📌 ' : ''}${esc(it.name)}
        </div>
        <div class="fmeta">${isAdmin ? `Sahip: ${it.ownerUid.slice(0, 8)}... · ` : ''}${e} · ${size(it.size)} · ${dateStr(it.date)}</div>
      </div>
      <svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>`;
    row.onclick = () => openSheet(it);
    list.appendChild(row);
  });
}

function listenFiles() {
  const list = $("list");
  list.innerHTML = '<div class="spinner"></div>';
  if (unsubFiles) unsubFiles();

  unsubFiles = onValue(dbRef(db, `files/${currentUser.uid}`), snap => {
    const items = [];
    snap.forEach(c => { 
      const v = c.val(); 
      items.push({ 
        id: c.key, ownerUid: currentUser.uid, name: v.name, size: v.size, date: v.createdAt, 
        path: v.path, store: v.store || "storage", chunks: v.chunks, type: v.type, pinned: !!v.pinned
      }); 
    });
    
    items.sort((a, b) => {
      if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
      return b.date - a.date;
    });
    
    allFilesData = items;
    renderList(allFilesData, $("searchInput").value);
  }, err => {
    list.innerHTML = `<div class="empty">Dosyalar yüklenemedi (${esc(err.code || err.message)}).</div>`;
  });
}

function listenAllFilesForAdmin() {
  const list = $("list");
  list.innerHTML = '<div class="spinner"></div>';
  if (unsubFiles) unsubFiles();

  unsubFiles = onValue(dbRef(db, `files`), snap => {
    const items = [];
    snap.forEach(userSnap => {
      const uid = userSnap.key;
      userSnap.forEach(c => {
        const v = c.val();
        items.push({ 
          id: c.key, ownerUid: uid, name: v.name, size: v.size, date: v.createdAt, 
          path: v.path, store: v.store || "storage", chunks: v.chunks, type: v.type, pinned: !!v.pinned
        });
      });
    });

    items.sort((a, b) => {
      if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
      return b.date - a.date;
    });

    allFilesData = items;
    renderList(allFilesData, $("searchInput").value);
  }, err => {
    list.innerHTML = `<div class="empty">Dosyalar yüklenemedi (${esc(err.code || err.message)}).</div>`;
  });
}

$("searchInput").oninput = (e) => {
  renderList(allFilesData, e.target.value);
};

/* ---------- Çoklu Dosya Seçme & Yükleme ---------- */
function pickFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  const newFilesArray = Array.from(fileList);
  
  newFilesArray.forEach(f => {
    const isAlreadyPicked = pickedFiles.some(item => item.file.name === f.name && item.file.size === f.size);
    if (!isAlreadyPicked) {
      if (pickedFiles.length < 4) {
        pickedFiles.push({
          file: f,
          ext: ext(f.name),
          baseName: baseNameWithoutExt(f.name)
        });
      }
    }
  });

  if (pickedFiles.length >= 4 && (pickedFiles.length + newFilesArray.length > 4)) {
    toast("En fazla 4 dosya seçebilirsiniz.");
  }

  renderPickedFiles();
}

function removeFile(index) {
  pickedFiles.splice(index, 1);
  renderPickedFiles();
}

function renderPickedFiles() {
  const listContainer = $("pickedList");
  listContainer.innerHTML = "";

  if (pickedFiles.length === 0) {
    $("picked").classList.remove("show");
    $("fileInput").value = "";
    return;
  }

  pickedFiles.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "picked-item";
    div.innerHTML = `
      <div class="picked-row">
        <div class="ficon" style="background:${color(item.ext)}">${esc(badge(item.ext))}</div>
        <input type="text" class="rename-input" data-index="${idx}" value="${esc(item.baseName)}" placeholder="Dosya adı">
        <span class="ext-badge">.${item.ext.toLowerCase()}</span>
        <button class="remove-btn" title="Kaldır" data-index="${idx}">✕</button>
      </div>
      <div class="progress" id="progress-${idx}"><i></i></div>
    `;
    
    const inputEl = div.querySelector(".rename-input");
    inputEl.oninput = e => {
      pickedFiles[idx].baseName = e.target.value;
    };

    const removeBtn = div.querySelector(".remove-btn");
    removeBtn.onclick = () => removeFile(idx);

    listContainer.appendChild(div);
  });

  $("picked").classList.add("show");
}

$("fileInput").onchange = e => {
  pickFiles(e.target.files);
  $("fileInput").value = "";
};

const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  pickFiles(e.dataTransfer.files);
});

const CHUNK = 512 * 1024;            
const MAX_DB = 25 * 1024 * 1024;     

const toB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});

function uploadToStorageWithProgress(file, path, setBarFn) {
  return new Promise((resolve, reject) => {
    const task = uploadBytesResumable(ref(storage, path), file, { contentType: file.type || "application/octet-stream" });
    let started = false;
    const timer = setTimeout(() => { if (!started) { task.cancel(); reject({ code: "storage/timeout" }); } }, 12000);
    task.on("state_changed",
      s => { 
        if (s.bytesTransferred > 0) { started = true; clearTimeout(timer); } 
        if(s.totalBytes > 0) setBarFn((s.bytesTransferred / s.totalBytes) * 100); 
      },
      err => { clearTimeout(timer); reject(err); },
      () => { clearTimeout(timer); resolve(); }
    );
  });
}

async function uploadToDbWithProgress(file, key, setBarFn) {
  if (file.size > MAX_DB) throw { code: "dosya-cok-buyuk (en fazla 25 MB)" };
  const n = Math.max(1, Math.ceil(file.size / CHUNK));
  for (let i = 0; i < n; i++) {
    const data = await toB64(file.slice(i * CHUNK, (i + 1) * CHUNK));
    await set(dbRef(db, `chunks/${currentUser.uid}/${key}/${i}`), data);
    setBarFn(((i + 1) / n) * 100);
  }
  return n;
}

$("uploadBtn").onclick = async () => {
  if (!pickedFiles.length || !currentUser) return;
  $("uploadBtn").disabled = true;

  const uploadTasks = pickedFiles.map(async (item, idx) => {
    const customBase = item.baseName ? item.baseName.trim() : "";
    const finalName = (customBase ? customBase : baseNameWithoutExt(item.file.name)) + "." + item.ext.toLowerCase();

    const file = item.file;
    const uid = currentUser.uid;
    const metaRef = push(dbRef(db, `files/${uid}`));
    const path = `uploads/${uid}/${Date.now()}_${finalName}`;
    const base = {
      name: finalName, size: file.size,
      type: file.type || "application/octet-stream",
      ext: item.ext, createdAt: Date.now(), pinned: false
    };

    const progressDiv = $(`progress-${idx}`);
    const barEl = progressDiv ? progressDiv.querySelector("i") : null;
    if (progressDiv) progressDiv.classList.add("show");
    const setBar = p => { if (barEl) barEl.style.width = p + "%"; };

    try {
      let meta;
      try {
        await uploadToStorageWithProgress(file, path, setBar);
        meta = { ...base, store: "storage", path };
      } catch (e) {
        setBar(0);
        const n = await uploadToDbWithProgress(file, metaRef.key, setBar);
        meta = { ...base, store: "db", chunks: n };
      }
      await set(metaRef, meta);
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  });

  const results = await Promise.all(uploadTasks);
  const successCount = results.filter(Boolean).length;

  if (successCount > 0) {
    toast(`${successCount} dosya başarıyla yüklendi ✓`);
    pickedFiles = [];
    renderPickedFiles();
  } else {
    toast("Yükleme sırasında hata oluştu.");
  }
  $("uploadBtn").disabled = false;
};

/* ---------- Detay, Sabitleme, Silme & İndirme Mantığı ---------- */
function openSheet(it) {
  selected = it;
  const e = ext(it.name);
  $("sIcon").textContent = badge(e); 
  $("sIcon").style.background = color(e);
  $("sName").textContent = it.name;
  $("sFormat").textContent = e;
  $("sSize").textContent = size(it.size);
  $("sDate").textContent = dateStr(it.date);

  const isAdmin = currentUser && currentUser.uid === ADMIN_UID;
  if (isAdmin) {
    $("ownerRow").style.display = "flex";
    $("sOwner").textContent = it.ownerUid;
  } else {
    $("ownerRow").style.display = "none";
  }

  $("pinBtn").textContent = it.pinned ? "Sabitlemeyi Kaldır" : "Başa Sabitle";

  // Admin her dosyayı silebilir, kullanıcı sadece kendi dosyasını sabitleyebilir/silebilir
  if (isAdmin || it.ownerUid === currentUser.uid) {
    $("pinBtn").style.display = "block";
  } else {
    $("pinBtn").style.display = "none";
  }

  if (isAdmin) {
    $("deleteBtn").style.display = "block";
  } else {
    $("deleteBtn").style.display = "none";
  }

  $("overlay").classList.add("show"); 
  $("sheet").classList.add("show");
}

function closeSheet() { 
  $("overlay").classList.remove("show"); 
  $("sheet").classList.remove("show"); 
}

$("overlay").onclick = closeSheet; 
$("closeBtn").onclick = closeSheet;

$("pinBtn").onclick = async () => {
  if (!selected) return;
  const newPinnedState = !selected.pinned;
  try {
    await update(dbRef(db, `files/${selected.ownerUid}/${selected.id}`), { pinned: newPinnedState });
    toast(newPinnedState ? "Dosya başa sabitlendi 📌" : "Sabitleme kaldırıldı");
    closeSheet();
  } catch (err) {
    toast("İşlem başarısız: " + (err.message || err.code));
  }
};

$("deleteBtn").onclick = async () => {
  if (!selected || currentUser.uid !== ADMIN_UID) return;
  if (!confirm(`"${selected.name}" adlı dosyayı kalıcı olarak silmek istediğinize emin misiniz?`)) return;

  const btn = $("deleteBtn");
  btn.disabled = true;
  btn.textContent = "Siliniyor...";

  try {
    if (selected.store === "db") {
      await remove(dbRef(db, `chunks/${selected.ownerUid}/${selected.id}`));
    } else if (selected.path) {
      try {
        await deleteObject(ref(storage, selected.path));
      } catch (e) {
        console.error("Storage delete warning:", e);
      }
    }
    await remove(dbRef(db, `files/${selected.ownerUid}/${selected.id}`));
    toast("Dosya kalıcı olarak silindi 🗑️");
    closeSheet();
  } catch (err) {
    toast("Silme hatası: " + (err.message || err.code));
  } finally {
    btn.disabled = false;
    btn.textContent = "Dosyayı Sil";
  }
};

$("downloadBtn").onclick = async () => {
  if (!selected) return;
  const btn = $("downloadBtn"); 
  btn.disabled = true; 
  btn.textContent = "İndiriliyor…";

  const saveBlob = (blob, filename) => {
    const a = document.createElement("a");
    const url = URL.createObjectURL(blob);
    a.href = url; 
    a.download = filename;
    document.body.appendChild(a); 
    a.click(); 
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  try {
    if (selected.store === "db") {
      const snap = await get(dbRef(db, `chunks/${selected.ownerUid}/${selected.id}`));
      if (!snap.exists()) throw new Error("Dosya parçaları bulunamadı.");
      
      const parts = [];
      for (let i = 0; i < selected.chunks; i++) {
        const chunkData = snap.child(String(i)).val();
        if (!chunkData) continue;
        const bin = atob(chunkData);
        const u8 = new Uint8Array(bin.length);
        for (let j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
        parts.push(u8);
      }
      saveBlob(new Blob(parts, { type: selected.type || "application/octet-stream" }), selected.name);
      toast("İndirme tamamlandı ✓");
    } else {
      const url = await getDownloadURL(ref(storage, selected.path));
      try {
        const res = await fetch(url);
        if(!res.ok) throw new Error("Ağ yanıtı başarısız.");
        const blob = await res.blob();
        saveBlob(blob, selected.name);
      } catch (_) {
        const a = document.createElement("a");
        a.href = url; 
        a.download = selected.name; 
        a.target = "_blank"; 
        a.rel = "noopener";
        document.body.appendChild(a); 
        a.click(); 
        a.remove();
      }
      toast("İndirme başladı ✓");
    }
  } catch (err) { 
    toast("İndirilemedi: " + (err.code || err.message)); 
  } finally {
    btn.disabled = false; 
    btn.textContent = "İndir";
  }
};
</script>
